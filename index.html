<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CinchStack</title>
<meta name="description" content="CinchStack is coming — making software stack decisions easier.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='5' rx='2' fill='%236ee7c9'/%3E%3Crect x='6' y='13.5' width='20' height='5' rx='2' fill='%236ee7c9' fill-opacity='.68'/%3E%3Crect x='6' y='21' width='20' height='5' rx='2' fill='%236ee7c9' fill-opacity='.36'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0d10;
    --fg: #f4f5f3;
    --muted: #8a9099;
    --accent: #6ee7c9;
    --field-bg: #14171b;
    --field-border: #262b31;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 6vh 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 30rem;
    text-align: center;
  }

  .mark {
    display: inline-flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 1.75rem;
  }

  .mark rect {
    animation: pulse 3.2s ease-in-out infinite;
  }

  .mark rect:nth-child(2) { animation-delay: .35s; }
  .mark rect:nth-child(3) { animation-delay: .7s; }

  @keyframes pulse {
    0%, 100% { opacity: .35; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark rect { animation: none; opacity: 1; }
  }

  h1 {
    margin: 0 0 .9rem;
    font-size: clamp(2.25rem, 6vw, 3.25rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  p.tagline {
    margin: 0 0 2.75rem;
    font-size: clamp(1rem, 2.4vw, 1.125rem);
    line-height: 1.55;
    color: var(--muted);
  }

  form {
    display: flex;
    gap: .5rem;
  }

  .hp {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  input[type="email"] {
    flex: 1;
    min-width: 0;
    padding: .85rem 1rem;
    font-size: 1rem;
    color: var(--fg);
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: .5rem;
    outline: none;
    transition: border-color .15s ease;
  }

  input[type="email"]::placeholder {
    color: #565c65;
  }

  input[type="email"]:focus {
    border-color: var(--accent);
  }

  input[type="email"]:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    padding: .85rem 1.25rem;
    font-size: 1rem;
    font-weight: 600;
    color: #06120e;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: .5rem;
    cursor: pointer;
    white-space: nowrap;
    outline: none;
    transition: filter .15s ease;
  }

  button:hover { filter: brightness(1.08); }
  button:active { filter: brightness(.95); }

  button:focus-visible {
    outline: 3px solid var(--fg);
    outline-offset: 3px;
  }

  button:disabled {
    cursor: default;
    filter: grayscale(.3) brightness(.85);
  }

  .note {
    margin: .9rem 0 0;
    font-size: .8rem;
    color: #565c65;
  }

  .success {
    display: none;
    padding: .95rem 1.1rem;
    font-size: .95rem;
    color: var(--accent);
    background: rgba(110, 231, 201, .08);
    border: 1px solid rgba(110, 231, 201, .35);
    border-radius: .5rem;
  }

  .success.show { display: block; }
  form.hide, .note.hide { display: none; }
</style>
</head>
<body>
<main>
  <svg class="mark" width="34" height="26" viewBox="0 0 34 26" aria-hidden="true">
    <rect x="0" y="0" width="34" height="7" rx="3" fill="#6ee7c9"></rect>
    <rect x="0" y="9.5" width="34" height="7" rx="3" fill="#6ee7c9"></rect>
    <rect x="0" y="19" width="34" height="7" rx="3" fill="#6ee7c9"></rect>
  </svg>

  <h1>CinchStack</h1>
  <p class="tagline">Choosing the right software stack shouldn&rsquo;t take a committee. We&rsquo;re making that decision easier.</p>

  <form id="signup-form" name="signup" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="signup">
    <p class="hp" aria-hidden="true">
      <label>Leave this field empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
    </p>
    <input type="email" name="email" placeholder="you@company.com" required aria-label="Email address">
    <button type="submit">Notify me</button>
  </form>
  <p class="note" id="form-note">No spam &mdash; just a note when we&rsquo;re live.</p>

  <div class="success" id="form-success" role="status">You&rsquo;re on the list. We&rsquo;ll be in touch.</div>
</main>

<script>
  (function () {
    var form = document.getElementById("signup-form");
    var note = document.getElementById("form-note");
    var success = document.getElementById("form-success");

    function encode(data) {
      return Object.keys(data)
        .map(function (key) { return encodeURIComponent(key) + "=" + encodeURIComponent(data[key]); })
        .join("&");
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var button = form.querySelector("button");
      var email = form.querySelector('input[name="email"]').value;
      var bot = form.querySelector('input[name="bot-field"]').value;

      if (bot) return; // honeypot tripped, silently drop

      button.disabled = true;
      button.textContent = "Sending…";

      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: encode({ "form-name": "signup", email: email })
      })
        .then(function () {
          form.classList.add("hide");
          note.classList.add("hide");
          success.classList.add("show");
        })
        .catch(function () {
          button.disabled = false;
          button.textContent = "Notify me";
          note.textContent = "Something went wrong — please try again.";
        });
    });
  })();
</script>
</body>
</html>
