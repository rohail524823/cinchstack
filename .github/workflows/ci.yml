name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Trace every price to its saved vendor page
        run: node scripts/trace-figures.mjs
      - name: Check every page's writing rules
        run: node scripts/lint-content.mjs --all
      - name: Build and run every gate
        run: npm run build
      # Phone-width layout and late-font layout shift, in the runner's preinstalled Chrome. Kept out of
      # the Netlify build (scripts/check.mjs), which has no browser. Liberation Sans is the Arial-metric
      # font the CSS fallback faces resolve to on Linux.
      - name: Mobile layout and font-swap check
        run: |
          fc-list | grep -qi "Liberation Sans" || (sudo apt-get update && sudo apt-get install -y fonts-liberation)
          node scripts/layout-check.mjs
