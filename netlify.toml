# cinchstack.com: static Astro build. The build fails if any gate in scripts/check.mjs fails,
# so a broken page never goes live.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Scripts: only /site.js (the analytics loader) and Google's tag, while GA_ID in src/lib/site.mjs is
# set. With GA_ID empty, script-src must be 'none'; scripts/check.mjs fails the build otherwise.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; font-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/changes/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

# The text files for AI assistants. llms-full.txt repeats every page's text, so it stays out of search
# results (noindex) while any crawler can still fetch and read it; the pages themselves are what get cited.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

# Static files without a content hash in their name: cached briefly, never immutable. /site.js holds
# the consent and privacy logic, so a fix to it must reach returning visitors within the hour.
[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The old placeholder had no other URLs; www redirects to the apex.
[[redirects]]
  from = "https://www.cinchstack.com/*"
  to = "https://cinchstack.com/:splat"
  status = 301
  force = true

# Netlify's own hostnames for the production site serve the same pages; send them to the apex so
# only one host can be crawled. Deploy previews (deploy-preview-N--...) are left alone.
[[redirects]]
  from = "https://cinchstack-site.netlify.app/*"
  to = "https://cinchstack.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://main--cinchstack-site.netlify.app/*"
  to = "https://cinchstack.com/:splat"
  status = 301
  force = true

# The 404 page's own URLs answer 404 too, never 200. Forced, because the file 404.html exists and
# Netlify would otherwise serve it with a 200 (redirect shadowing). /404/ normalizes to /404.
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/404.html"
  to = "/404.html"
  status = 404
  force = true
